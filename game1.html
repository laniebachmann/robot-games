<!DOCTYPE html>
<html>
<head>
  <title>Robot Recruitment</title>

  <!-- Load libraries -->
  <script src="static/lib/jquery-3.3.1/jquery.min.js"></script>
  <script src="static/lib/jspsych-6.1.0/jspsych.js"></script>
  <script src="static/js/session.js" type="text/javascript"></script>

  <!-- Load experiment -->
  <script src="static/js/game1/game1-experiment.js" type="text/javascript"></script>

  <!-- Load NivTurk plug-ins -->
  <script src="static/js/datapipe-plugins.js" type="text/javascript"></script>

  <!-- Load jsPsych plug-ins -->
  <script src="static/js/game1/jspsych-game1-instructions.js" type="text/javascript"></script>
  <script src="static/js/game1/jspsych-game1-comprehension.js" type="text/javascript"></script>
  <script src="static/js/game1/jspsych-game1-practice.js" type="text/javascript"></script>
  <script src="static/js/game1/jspsych-game1-learning.js" type="text/javascript"></script>
  <script src="static/js/game1/jspsych-game1-probe.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-call-function.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-fullscreen.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-html-keyboard-response.js"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-call-function.js"></script>

  <!-- Load CSS styles -->
  <link rel="stylesheet" href="static/lib/jspsych-6.1.0/css/jspsych.css">
  <link rel="stylesheet" href="static/css/robots-css.min.css">

</head>
<body></body>
<script>
  var next_key                = ['space'];

  var current_phase_num       = 1;

  // Display alert message on back/refresh.
  // https://developer.mozilla.org/en-US/docs/Web/API/WindowEventHandlers/onbeforeunload
  function verify_unload(e){
    e.preventDefault();
    (e || window.event).returnValue = null;
    return null;
  };
  window.addEventListener("beforeunload", verify_unload);

  // Add version metadata.
  jsPsych.data.addProperties({
    task_version: 'pipeline-v1-palm-fixedcounts',
  });

  // Define global variables.
  var low_quality = false;

  // Define timeline.
  var timeline = [];

  // Full screen is handled once by index.html (the shell); only request it here if the page is opened on its own.
  document.body.style.backgroundColor = "#d2d2d2";
  if (!IN_SHELL) {
    timeline.push({
      type: 'fullscreen',
      fullscreen_mode: true,
    });
  }

  var press_to_continue = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:3.2vh; line-height:1.5;">' + "When you are ready, press the SPACEBAR to begin." + '</p>',
    choices: next_key,
    response_ends_trial: true,
    data: {type: "press_to_continue"},
    trial_duration:null,
  }

  var start_run = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:3.2vh; line-height:1.5;">' + "Get ready. The game will begin shortly..." + '</p>',
    choices: "NO_KEYS",
    response_ends_trial: true,
    data: {type: "start_run"},
    trial_duration: 1500,
    on_finish: function(data){
      data.trial_offset_date_now = Date.now();
      onset = 0; // restart onset in the beginning of every run
    }
  }

  var init_fixation_period      = 4000;

  var init_fixation = {
    type: 'html-keyboard-response',
    data: {type: 'initial_fixation',
        trial_onset: 0,
        trial_duration: init_fixation_period},
    stimulus: `<style>
        body {
          height: 100vh;
          max-height: 100vh;
          overflow: hidden;
          position: fixed;
          background: linear-gradient(0deg, rgba(210,210,210,1) 50%, rgba(230,230,230,1) 100%);
        }
        </style>
        <div style="font-size:150px;position: absolute;top: 50%;left:50%;transform: translateX(-40px);text-align: center;">+</div>
        <div class="wrap">
        <div class="floor"></div>`,
    choices: "NO_KEYS",
    trial_duration: init_fixation_period,
    on_finish: function(data){
      data.trial_offset_date_now = Date.now();
      onset += init_fixation_period;
    }
  }

  var save_phase1_data = {
    type: 'call-function',
    func: function() {
      console.log('saving phase 1');
      pass_data_palminteri(1);
      current_phase_num = 2;
    }
  }

  var end_task = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:3.2vh; line-height:1.5;">' + "Good job! You completed Game 1. Next is Game 2.<br>Press the SPACEBAR when you're ready to begin." + '</p>',
    choices: next_key,
    trial_duration: null,
  }

  timeline.push(press_to_continue);
  timeline.push(start_run);
  timeline.push(init_fixation);
  timeline = timeline.concat(learning_phase_1);
  timeline = timeline.concat(instructions_05);
  timeline.push(press_to_continue);
  timeline.push(start_run);
  timeline.push(init_fixation);
  timeline = timeline.concat(probe_phase_1);
  timeline = timeline.concat(save_phase1_data);

  // end of RUN
  timeline = timeline.concat(instructions_06);
  timeline.push(press_to_continue);
  timeline.push(start_run);
  timeline.push(init_fixation);
  timeline = timeline.concat(learning_phase_2);
  timeline = timeline.concat(instructions_05);
  timeline.push(press_to_continue);
  timeline.push(start_run);
  timeline.push(init_fixation);
  timeline = timeline.concat(probe_phase_2);
  timeline.push(end_task);

  jsPsych.init({
    timeline: timeline,
    show_progress_bar: false,
    on_finish: function() {

      // Remove requirement to verify redirect
      window.removeEventListener("beforeunload", verify_unload);

      // Add interactions to the data variable
      var interaction_data = jsPsych.data.getInteractionData();
      jsPsych.data.get().addToLast({interactions: interaction_data.json()});

      // Display jsPsych data in viewport.
      // jsPsych.data.displayData();

      pass_data_palminteri(2);

    }
  })

</script>
</html>
