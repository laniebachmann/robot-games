<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Factory</title>

  <!-- Load libraries -->
  <script src="static/lib/jquery-3.3.1/jquery.min.js"></script>
  <script src="static/lib/jspsych-6.1.0/jspsych.js"></script>
  <script src="static/js/session.js" type="text/javascript"></script>

  <!-- Load experiment -->
  <script src="static/js/game2/game2-runsheets.js" type="text/javascript"></script>
  <script src="static/js/game2/game2-experiment.js" type="text/javascript"></script>

  <!-- Load NivTurk plug-ins -->
  <script src="static/js/datapipe-plugins.js" type="text/javascript"></script>

  <!-- Load jsPsych plug-ins -->
  <script src="static/js/game2/jspsych-game2-trial.js" type="text/javascript"></script>
  <script src="static/js/game2/jspsych-game2-instructions.js" type="text/javascript"></script>
  <script src="static/js/game2/jspsych-game2-comprehension.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-call-function.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-fullscreen.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-html-keyboard-response.js"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-call-function.js"></script>
  <script src="static/lib/jspsych-6.1.0/plugins/jspsych-survey-text.js"></script>

  <!-- Load CSS styles -->
  <link href="static/lib/jspsych-6.1.0/css/jspsych.css" rel="stylesheet" type="text/css"/>
  <link href="static/css/factory-css.min.css" rel="stylesheet" type="text/css"/>

  <link rel="preload" href="static/css/BACS1.otf" as="font" crossorigin="anonymous" />
  <link rel="preload" href="static/css/BACS2serif.otf" as="font" crossorigin="anonymous" />
  <link rel="preload" href="static/css/Elianto-Regular.ttf" as="font" crossorigin="anonymous" />

  <link rel="stylesheet" href="static/css/pit-overrides.css">
</head>
<body></body>
<script>
  var next_key                = ['space'];

  var current_phase_num       = 1;

  // Display alert message on back/refresh.
  // https://developer.mozilla.org/en-US/docs/Web/API/WindowEventHandlers/onbeforeunload
  function verify_unload(e){
    e.preventDefault();
    (e || window.event).returnValue = null;
    return null;
  };
  window.addEventListener("beforeunload", verify_unload);

  // Add version metadata.
  jsPsych.data.addProperties({
    task_version: 'pipeline-v1-palm-fixedcounts',
  });

  // Define global variables.
  var low_quality = false;

  // Define timeline.
  var timeline = [];

  var press_to_continue = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:1.66vw; line-height:1.5;">' + "Get ready to begin <b>Block 1 of 2</b>.<br>When you are ready, press the SPACEBAR to begin." + '</p>',
    choices: next_key,
    response_ends_trial: true,
    data: {type: "press_to_continue"},
    trial_duration:null,
  }

  var wait_to_continue = {
    type: 'html-keyboard-response',
    stimulus: "Great job! You can take a quick break before the next block begins. When you are ready, press the SPACEBAR to continue.",
    choices: next_key,
    response_ends_trial: true,
    data: {type: "wait_to_continue"},
    trial_duration:null,
  }

  var start_run = {
    type: 'html-keyboard-response',
    stimulus: '<p style="font-size:1.66vw; line-height:1.5;">' + "Get ready. The game will begin shortly..." + '</p>',
    choices: "NO_KEYS",
    response_ends_trial: true,
    data: {type: "start_run"},
    trial_duration: 1500,
    on_finish: function(data){
      onset = 0; // restart onset in the beginning of every run
    }
  }

  var init_fixation_period      = 4000;

  var init_fixation = {
    type: 'html-keyboard-response',
    data: {type: 'initial_fixation',
        trial_onset: 0,
        trial_duration: init_fixation_period},
    stimulus: `<style>
        body {
          height: 100vh;
          max-height: 100vh;
          overflow: hidden;
          position: fixed;
          background: -webkit-gradient(linear, left bottom, left top, from(#808080), color-stop(50%, #606060), color-stop(50%, rgba(28, 25, 23, 0.5)), to(rgba(179, 230, 230, 0.5)));
          background: linear-gradient(0deg, #808080 0%, #606060 50%, #A0A0A0 50%, #D3D3D3 100%);
        }
        .jspsych-content-wrapper {
          overflow: hidden;
        }
        @-webkit-keyframes pavlovian {
          0%    {border-bottom-color: rgba(0, 0, 0, 0);}
          90%   {border-bottom-color: rgba(0, 0, 0, 0);}
          100%  {border-bottom-color: #FFFFF080;}
        }
        @keyframes pavlovian {
          0%    {border-bottom-color: rgba(0, 0, 0, 0);}
          90%   {border-bottom-color: rgba(0, 0, 0, 0);}
          100%  {border-bottom-color: #FFFFF080;}
        }
         </style>
         <div class="factory-wrap">
         <div class="machine-back"></div>
         <div class="shadows"></div>
         <div class="machine-front">
         <div class="score-container">
         <div class="score" id="outcome"></div>
         </div></div>
         <div class="machine-top"></div>
         <div style="font-size:80px;position: absolute;top: 45%;left:50%;transform: translateX(-22px);text-align: center;">+</div>
         </div>`,
    choices: "NO_KEYS",
    trial_duration: init_fixation_period,
    on_finish: function(data){
      onset += init_fixation_period;
    }
  }

  // Full screen is handled once by index.html (the shell); only request it here if the page is opened on its own.
  document.body.style.backgroundColor = "#d2d2d2";
  if (!IN_SHELL) {
    timeline.push({
      type: 'fullscreen',
      fullscreen_mode: true,
    });
  }

  var save_phase1_data = {
    type: 'call-function',
    func: function() {
      console.log('saving phase 1');
      pass_data_pit(1);
      current_phase_num = 2;
    }
  }

  //timeline = timeline.concat(INSTRUCTIONS);        // Instructions loop
  //timeline = timeline.concat(READY_01);            // Ready check (block 1)
  timeline.push(press_to_continue);
  timeline.push(start_run);
  timeline.push(init_fixation);
  timeline = timeline.concat(PIT.slice(0,120));     // PIT task (block 1)
  timeline = timeline.concat(save_phase1_data);
  timeline.push(ACCURACY_CHECK);                    // Records go-to-win accuracy + variability flags (not auto-excluding, see pit-experiment.js)
  // timeline.push(wait_to_continue);              // removed: READY_02 already gives a break screen with a Next button
  timeline = timeline.concat(READY_02);            // Ready check (block 2)
  timeline.push(start_run);
  timeline.push(init_fixation);
  timeline = timeline.concat(PIT.slice(120,240));   // PIT task (block 2)
  timeline = timeline.concat(FINISHED);            // End of task

  // End-of-study strategy question (also screens for low-effort / AI-written answers).
  timeline.push({
    type: 'survey-text',
    preamble: '<div style="font-size:22px; line-height:1.5; max-width:800px; margin:auto; text-align:left;">' +
              'Before you finish, please tell us in a few sentences how you played the games.' + AI_NOTE_HTML + '</div>',
    questions: [
      {prompt: '<p style="font-size:20px;">In <b>Game 1</b>, how did you decide which robot to pick for your team?</p>',
       name: 'strategy_game1', rows: 4, columns: 70, required: true, placeholder: ''},
      {prompt: '<p style="font-size:20px;">In <b>Game 2</b>, how did you decide whether to repair a robot or not?</p>',
       name: 'strategy_game2', rows: 4, columns: 70, required: true, placeholder: ''},
    ],
    button_label: 'Submit',
    data: {type: 'strategy_question'},
    on_finish: function(data) {
      var answers = JSON.parse(data.responses);
      data.strategy_game1 = answers.strategy_game1;
      data.strategy_game2 = answers.strategy_game2;
      // true if the hidden canary word for AI agents appears in either answer
      data.ai_canary = new RegExp(AI_CANARY_WORD, 'i').test(answers.strategy_game1 + ' ' + answers.strategy_game2);
    }
  });

  jsPsych.init({
    timeline: timeline,
    // preload_images: rune_stimuli,
    show_progress_bar: false,
    on_finish: function() {

      // Remove requirement to verify redirect
      window.removeEventListener("beforeunload", verify_unload);

      // Add interactions to the data variable
      var interaction_data = jsPsych.data.getInteractionData();
      jsPsych.data.get().addToLast({interactions: interaction_data.json()});

      // Display jsPsych data in viewport.
      // jsPsych.data.displayData();

      // Save complete dataset to disk.
      pass_data_pit(2);

    }

  })

</script>
</html>
